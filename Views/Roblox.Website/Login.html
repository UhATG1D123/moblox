<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login - Moblox</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e3e3e3;color:#393b3d;font:13px Arial,Helvetica,sans-serif}.top{height:50px;background:#f7f7f7;border-bottom:1px solid #c8c8c8;display:flex;align-items:center;padding:0 max(16px,calc((100% - 970px)/2));gap:28px}.logo{font-size:25px;font-weight:bold;letter-spacing:-1.4px;color:#333;text-decoration:none}.logo span{color:#777}.top a:not(.logo){color:#444;text-decoration:none;font-weight:bold}.wrap{width:min(970px,calc(100% - 24px));margin:28px auto}.panel{width:min(400px,100%);margin:0 auto;background:#fff;border:1px solid #c8c8c8;border-radius:3px;padding:24px 28px;box-shadow:0 1px 2px #00000012}.panel h1{text-align:center;font-size:20px;font-weight:normal;margin:0 0 23px;color:#333}.field{margin:15px 0}.field label{display:block;font-size:14px;margin-bottom:7px}.field input{width:100%;height:36px;padding:7px 9px;border:1px solid #b9b9b9;border-radius:3px;font-size:14px;box-shadow:inset 0 1px 2px #0000000c}.submit{width:100%;height:38px;background:#6e9e3a;border:1px solid #5e8b31;border-radius:3px;color:white;font-size:15px;font-weight:bold;cursor:pointer;margin-top:7px}.submit:disabled{opacity:.65}.error{color:#b00020;min-height:20px;text-align:center;margin-top:12px}.foot{text-align:center;margin-top:22px;padding-top:17px;border-top:1px solid #e4e4e4;color:#666}.foot a{color:#2672a5;text-decoration:none;font-weight:bold}@media(max-width:500px){.top{gap:15px}.top a:not(.logo){font-size:12px}.panel{padding:22px 18px}}
</style>
</head>
<body>
<header class="top"><a class="logo" href="/">moblox<span>.</span></a><a href="/home">Home</a><a href="/catalog">Catalog</a></header>
<main class="wrap"><section class="panel">
<h1>Login to Moblox</h1>
<form id="login-form">
<div class="field"><label for="username">Username</label><input id="username" name="username" autocomplete="username" required maxlength="20"></div>
<div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required maxlength="128"></div>
<button class="submit" id="submit" type="submit">Login</button><div class="error" id="error" role="alert"></div>
</form>
<div class="foot">Don't have an account? <a href="/">Sign up</a></div>
</section></main>
<script>
const form=document.getElementById('login-form'),button=document.getElementById('submit'),error=document.getElementById('error');
form.addEventListener('submit',async event=>{event.preventDefault();error.textContent='';button.disabled=true;button.textContent='Logging in...';try{const response=await fetch('/v2/login',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:form.username.value.trim(),password:form.password.value})});const data=await response.json().catch(()=>({}));if(!response.ok){error.textContent=data?.errors?.[0]?.userFacingMessage||data?.errors?.[0]?.message||'Login failed. Check your username and password and try again.';return;}window.location.assign('/home');}catch{error.textContent='Connection error. Please try again.';}finally{button.disabled=false;button.textContent='Login';}});
</script>
</body>
</html>
