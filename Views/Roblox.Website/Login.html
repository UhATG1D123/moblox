<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log In - Moblox</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f5f7;color:#232527;font:16px Arial,sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(100%,420px);background:#fff;border:1px solid #e1e3e6;border-radius:12px;padding:30px;box-shadow:0 8px 30px #0000000a}.brand{font-size:30px;font-weight:800;letter-spacing:-1px;margin:0 0 8px}.brand span{color:#335fff}h1{font-size:23px;margin:24px 0 8px}p{color:#60656b;line-height:1.5}label{display:block;font-weight:700;margin:18px 0 7px}input{width:100%;padding:13px 12px;border:1px solid #b9bec5;border-radius:7px;font-size:16px}button{width:100%;border:0;border-radius:7px;padding:14px;margin-top:22px;background:#335fff;color:white;font-size:16px;font-weight:700;cursor:pointer}button:disabled{opacity:.6;cursor:wait}.error{color:#b42318;min-height:22px;margin-top:14px}.signup{display:block;text-align:center;margin-top:20px;color:#335fff;text-decoration:none}
</style>
</head>
<body>
<main class="card">
<div class="brand">moblox<span>.</span></div>
<h1>Log in to Moblox</h1>
<p>Welcome back. Enter your username and password to continue.</p>
<form id="login-form">
<label for="username">Username</label><input id="username" name="username" autocomplete="username" required maxlength="20">
<label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required maxlength="128">
<button id="submit" type="submit">Log In</button>
<div class="error" id="error" role="alert"></div>
</form>
<a class="signup" href="/">Need an account? Sign up</a>
</main>
<script>
const form=document.getElementById('login-form');
const button=document.getElementById('submit');
const error=document.getElementById('error');
form.addEventListener('submit',async event=>{
 event.preventDefault();error.textContent='';button.disabled=true;button.textContent='Logging in…';
 try{
  const response=await fetch('/v2/login',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:form.username.value.trim(),password:form.password.value})});
  const data=await response.json().catch(()=>({}));
  if(!response.ok){error.textContent=data?.errors?.[0]?.userFacingMessage||data?.errors?.[0]?.message||'We could not log you in. Please try again.';return;}
  window.location.assign('/home');
 }catch{error.textContent='Connection error. Please try again.';}
 finally{button.disabled=false;button.textContent='Log In';}
});
</script>
</body>
</html>
